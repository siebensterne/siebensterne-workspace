# SPDX-License-Identifier: Apache-2.0
# Workspace orchestration hook set. The C++ formatter, analyzer and q/kdb+
# contracts are owned by Fieldbook and Nirnay because only those repositories
# carry those sources. Workspace hooks cover shell policy and the shared CMake
# baseline only. Tool versions are pinned in WORKSPACE.lock.json; the source
# repositories' hook set is pinned in their shared quality-contract.json.
minimum_pre_commit_version: "4.0.0"
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck 0.11.0.1 (.shellcheckrc)
        entry: shellcheck
        language: system
        files: '\.(sh|bash|zsh)$'
        require_serial: true

      - id: cmake-strict
        name: CMake strict workflow (GCC and Clang, build and ctest)
        entry: bash -c 'cmake --workflow --preset strict-gcc && cmake --workflow --preset strict-clang' --
        language: system
        always_run: true
        pass_filenames: false
