name: M8 e2e paper path

# REQUIRED, fail-closed gate. Builds the Fieldbook producer and the Nirnay
# verifier from the exact commits recorded in CURRENT-STATE.json, runs abstract
# non-market NDC bytes through producer -> verifier (typed REJECT_RIGHTS_EVIDENCE
# refusal, no receipt), and verifies a Fieldbook -> Nirnay neutral adapter that
# emits deterministic opaque sequence-only events. G6 closes only for that
# rights-refused neutral fixture. D11 retires synthetic market-shaped fixtures
# and no approved fixture amendment or admitted dataset exists, so no paper
# replay runs here and G4/G5 stay BLOCKED. G9 stays BLOCKED because Q5 operator
# authorization cannot be automated. The documented exit is 3 and the job stays
# green while accepting only that exit and preserving failure_reason. Unexpected
# exits fail. The evidence JSON is always uploaded. No secret, provider contact,
# collection, holdout, admitted dataset, market data or live execution is used.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e-paper-path:
    name: Deterministic producer/verifier, rights refusal and neutral adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out workspace authority and gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve exact repository commits from CURRENT-STATE.json
        id: heads
        run: |
          set -euo pipefail
          fieldbook_sha="$(jq -er '.source_heads_at_record_time.fieldbook' CURRENT-STATE.json)"
          nirnay_sha="$(jq -er '.source_heads_at_record_time.nirnay' CURRENT-STATE.json)"
          [[ "$fieldbook_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid Fieldbook SHA" >&2; exit 1; }
          [[ "$nirnay_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid Nirnay SHA" >&2; exit 1; }
          echo "fieldbook=$fieldbook_sha" >> "$GITHUB_OUTPUT"
          echo "nirnay=$nirnay_sha" >> "$GITHUB_OUTPUT"
          echo "Fieldbook $fieldbook_sha / Nirnay $nirnay_sha"

      - name: Check out Fieldbook at the recorded commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: siebensterne/fieldbook
          ref: ${{ steps.heads.outputs.fieldbook }}
          path: fieldbook
          persist-credentials: false

      - name: Check out Nirnay at the recorded commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: siebensterne/nirnay
          ref: ${{ steps.heads.outputs.nirnay }}
          path: nirnay
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Run required e2e paper path
        id: gate
        env:
          FIELDBOOK_SHA: ${{ steps.heads.outputs.fieldbook }}
          NIRNAY_SHA: ${{ steps.heads.outputs.nirnay }}
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-paper-path
        run: |
          set -uo pipefail
          code=0
          bash scripts/e2e_paper_path.sh \
            --out "$E2E_WORK_DIR/e2e-paper-path.json" --work "$E2E_WORK_DIR" || code=$?
          # Exit 3 is the documented BLOCKED outcome: the script still emits
          # complete fail-closed evidence. Only unexpected failures fail the job.
          if [[ "$code" -ne 0 && "$code" -ne 3 ]]; then
            printf 'unexpected e2e gate exit: %s\n' "$code" >&2
            exit "$code"
          fi
          printf 'gate_exit=%s\n' "$code" >> "$GITHUB_OUTPUT"

      - name: Verify e2e evidence describes this run
        if: always()
        env:
          FIELDBOOK_SHA: ${{ steps.heads.outputs.fieldbook }}
          NIRNAY_SHA: ${{ steps.heads.outputs.nirnay }}
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-paper-path
          GATE_EXIT: ${{ steps.gate.outputs.gate_exit }}
        run: |
          set -euo pipefail
          result="$E2E_WORK_DIR/e2e-paper-path.json"
          [[ -s "$result" ]] || { printf 'required evidence is missing: %s\n' "$result" >&2; exit 1; }
          # Exit 3 is the only expected documented outcome while G4/G5/G9 are
          # BLOCKED. Any other successful-looking result is rejected here.
          [[ "$GATE_EXIT" == "3" ]] || {
            printf 'unexpected gate exit in evidence verification: %s\n' "$GATE_EXIT" >&2
            exit 1
          }
          jq -e '
            .schema_version == 1 and
            .gate == "m8-e2e-paper-path" and
            .result == "BLOCKED" and
            (.failure_reason | type == "string" and length > 0) and
            (.failure_reason | contains("D11") and contains("G4") and contains("G5")
             and contains("G9") and contains("Q5")) and
            (.run_id | type == "string" and length > 0) and
            .source_heads.fieldbook == env.FIELDBOOK_SHA and
            .source_heads.nirnay == env.NIRNAY_SHA and
            (.binaries.producer.sha256 | type == "string" and length == 64) and
            (.binaries.verifier.sha256 | type == "string" and length == 64) and
            .binaries.paper_engine.sha256 == null and
            .binaries.paper_engine.source == "NOT_BUILT_D11_RETIRED_MARKET_SHAPED_REPLAY" and
            .rights.state == "UNKNOWN" and
            .rights.case.status == "PASS" and
            .rights.case.actual.code == "REJECT_RIGHTS_EVIDENCE" and
            (.paper_path.d11_scope.status == "BLOCKED") and
            (.paper_path.d11_scope.market_shaped_replay_executed == false) and
            (.paper_path.d11_scope.standalone_paper_engine_claim == false) and
            (.paper_path.d11_scope.cross_repository_claim == false) and
            (.paper_path.d11_scope.admitted_data == false) and
            (.paper_path.d11_scope.reason | contains("D11")) and
            (.paper_path | has("replay_digest") | not) and
            (.paper_path | has("risk_baseline") | not) and
            (.paper_path | has("risk_tight") | not) and
            (.neutral_fixture.d11_market_shaped_paper_fixture == "RETIRED_NOT_GENERATED") and
            (.qualification.d11_scope.status == "BLOCKED") and
            (.qualification.d11_scope.market_shaped_replay_executed == false) and
            (.gates.G4 == "BLOCKED") and
            (.gates.G5 == "BLOCKED") and
            (.gate_explanations.G4 | contains("D11")) and
            (.gate_explanations.G5 | contains("D11")) and
            ([.qualification.checks[] | .id] == ["Q0","Q1","Q2","Q3","Q4","Q5"]) and
            ([.qualification.checks[0:5][] | .status] | all(. == "PASS")) and
            (.qualification.checks[5].status == "BLOCKED") and
            ([.boundaries[]] | all(. == false)) and
            ([paths(scalars) as $p | ($p | map(tostring) | join(".") | ascii_downcase)
              | select(test("venue|instrument|quote|bid|ask|price|trade|strategy|order"))]
             | length == 0) and
            (.gates.G6 == (if .paper_path.adapter.status == "linked" then "PASS" else "BLOCKED" end)) and
            (.gates.G9 == "BLOCKED") and
            (if .paper_path.adapter.status == "linked" then
               .paper_path.adapter.cross_repository_claim == true and
               .paper_path.adapter.claim_scope == "NEUTRAL_RIGHTS_REFUSED_FIXTURE_ONLY" and
               .paper_path.adapter.rights_refused_only == true and
               (.paper_path.adapter.determinism == "PASS") and
               (.paper_path.adapter.neutral_dataset_sha256 | type == "string" and length == 64)
             else
               .paper_path.adapter.cross_repository_claim == false
             end)
          ' "$result" >/dev/null

      - name: Upload e2e paper path evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-paper-path-evidence
          path: |
            ${{ runner.temp }}/e2e-paper-path/e2e-paper-path.json
            ${{ runner.temp }}/e2e-paper-path/diagnostics/*.json
            ${{ runner.temp }}/e2e-paper-path/paper/dataset-adapted/events.jsonl
            ${{ runner.temp }}/e2e-paper-path/paper/dataset-adapted-repeat/events.jsonl
            ${{ runner.temp }}/e2e-paper-path/qualification/*.json
            ${{ runner.temp }}/e2e-paper-path/logs/*.log
          if-no-files-found: error
